version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - horstmeier
    labels:
      - dependencies
      - dotnet
    commit-message:
      prefix: "chore(deps):"
      include: "scope"

